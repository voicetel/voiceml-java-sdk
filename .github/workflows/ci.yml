name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (javac -Xlint:all -Werror, javadoc doclint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      # The compiler plugin runs -Xlint:all with failOnWarning, and the javadoc plugin runs
      # doclint all,-missing with failOnWarnings, so any warning fails this job.
      - run: mvn -B --no-transfer-progress -DskipTests verify

  test:
    name: Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The test suite needs Java 17 (JUnit 6). The Java 11 floor is covered by java11-runtime.
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - run: mvn -B --no-transfer-progress verify
      - name: Fixture-corpus conformance
        run: |
          echo "ConformanceTest skipped: VOICEML_CONFORMANCE_FIXTURES is not configured in CI (private fixture corpus)."
          echo "contract.SpecContractTest ran above against the vendored public spec (every operation and response schema)."

  release-bundle:
    name: Central bundle layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      # Builds the exact bundle the publish workflow uploads, with the runner's default
      # Maven, but stops before signing (no key here) and before upload (skipUpload).
      - name: Build the Central Portal bundle
        run: mvn -B --no-transfer-progress -P release deploy -DskipTests -Dgpg.skip=true -DskipUpload=true
      - name: Check the bundle layout
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          DIR="com/voicetel/voiceml/$VERSION"
          unzip -Z1 target/central-publishing/central-bundle.zip | sort > target/bundle-entries.txt
          cat target/bundle-entries.txt
          if grep -vE "^$DIR/[^/]+$" target/bundle-entries.txt; then
            echo "::error::bundle has entries outside $DIR; the Portal rejects such deployments"
            exit 1
          fi
          if grep -E 'maven-metadata|_remote\.repositories' target/bundle-entries.txt; then
            echo "::error::bundle contains local-repository metadata"
            exit 1
          fi
          for f in "voiceml-$VERSION.pom" "voiceml-$VERSION.jar" "voiceml-$VERSION-sources.jar" "voiceml-$VERSION-javadoc.jar"; do
            grep -qxF "$DIR/$f" target/bundle-entries.txt || { echo "::error::bundle is missing $f"; exit 1; }
          done

  java11-runtime:
    name: Runtime smoke (JDK 11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Build the jar (release 11) and collect runtime dependencies
        run: mvn -B --no-transfer-progress -DskipTests package dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/runtime-deps
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Compile and run the smoke program on JDK 11
        run: |
          java -version
          JAR=$(ls target/voiceml-*.jar | grep -v -e sources -e javadoc)
          javac -Xlint:all -Werror --release 11 -cp "$JAR:target/runtime-deps/*" -d target/smoke \
            src/smoke/java/com/voicetel/voiceml/smoke/Jdk11Smoke.java
          java -cp "target/smoke:$JAR:target/runtime-deps/*" com.voicetel.voiceml.smoke.Jdk11Smoke
